name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build App with Automated Skeleton
        run: |
          mkdir build_env
          cd build_env
          flutter create . --org com.example --platforms=android
          cp -rf ../lib .
          cp -f ../pubspec.yaml .
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          
